# Publishes one package to npm with provenance via npm trusted publishing (no token).
# The trusted publisher on npmjs.com must name: org SCDEVBrazil, repo standards-packages,
# workflow file publish.yml. Run by hand: Actions -> publish -> Run workflow.
name: publish
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package folder under packages/
        required: true
        default: instant-nav
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run
      - name: Publish
        working-directory: packages/${{ inputs.package }}
        run: npm publish --provenance --access public
